---
- name: Copy Media Docker configuration files
  hosts: media
  become: true

  tasks:
    - name: Copy Media Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/media/compose/media/docker-compose.yaml"
        dest: /home/dharaniis/docker/media/docker-compose.yaml
        owner: dharaniis
        group: dharaniis
        mode: "0644"
        backup: true

    - name: Copy Alacarte Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/media/compose/alacarte/docker-compose.yml"
        dest: /home/dharaniis/docker/alacarte/docker-compose.yml
        owner: dharaniis
        group: dharaniis
        mode: "0644"
        backup: true

    - name: Copy Telegram Downloader Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/media/compose/telegram-downloader/docker-compose.prod.yml"
        dest: /home/dharaniis/docker/telegram-downloader/docker-compose.prod.yml
        owner: dharaniis
        group: dharaniis
        mode: "0644"
        backup: true

    - name: Copy TorrentBot Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/media/compose/torrentbot/docker-compose.yml"
        dest: /home/dharaniis/docker/TorrentBot/docker-compose.yml
        owner: dharaniis
        group: dharaniis
        mode: "0644"
        backup: true

    - name: Copy Media monitoring Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/shared/compose/monitoring/docker-compose.yaml"
        dest: /home/dharaniis/docker/monitoring/docker-compose.yaml
        owner: dharaniis
        group: dharaniis
        mode: "0644"
        backup: true

    - name: Copy Media Alloy configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../docker/shared/compose/monitoring/alloy/config.alloy"
        dest: /home/dharaniis/docker/monitoring/alloy/config.alloy
        owner: dharaniis
        group: dharaniis
        mode: "0644"
        backup: true

