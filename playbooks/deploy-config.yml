---
- name: Copy Media Docker configuration files
  hosts: media
  become: true

  tasks:
    - name: Synchronize configuration for Media projects
      ansible.builtin.include_tasks:
        file: tasks/sync-config.yml
      loop: "{{ docker_compose_projects }}"
      loop_control:
        loop_var: compose_project
        label: "{{ compose_project.name }}"

- name: Copy Cloud Docker configuration files
  hosts: cloud
  become: true

  tasks:
    - name: Synchronize configuration for Cloud projects
      ansible.builtin.include_tasks:
        file: tasks/sync-config.yml
      loop: "{{ docker_compose_projects }}"
      loop_control:
        loop_var: compose_project
        label: "{{ compose_project.name }}"

- name: Copy Monitor Docker configuration files
  hosts: monitor
  become: true

  tasks:
    - name: Synchronize configuration for Monitor projects
      ansible.builtin.include_tasks:
        file: tasks/sync-config.yml
      loop: "{{ docker_compose_projects }}"
      loop_control:
        loop_var: compose_project
        label: "{{ compose_project.name }}"
